# Every merge to main is gated on this: the build, the tests, the pinned lint, the sanitizer
# battery, and the pinned format sweep. What lands is what passed on a machine nobody's editor
# had prepared.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# A follow-up push cancels the run it obsoleted, since two runs of one branch answer the same
# question twice and the second answer is the one that matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      # The codegen gate: the ritual's escape and instruction ceilings, enforced, so the next
      # change that puts string machinery back in a hot function fails here instead of in a
      # retrospective. The ceilings are generous until the campaign tightens them into budgets.
      - run: python3 scripts/codegen.py --build build --gate scripts/codegen-blessed.txt
      # The linter at the pinned LLVM version, reading .clang-tidy and the compile database the
      # configure step wrote, so the runner, a laptop and an editor's clangd agree on every
      # finding. Sources only: headers are checked through their includers via HeaderFilterRegex.
      - run: |
          git ls-files '*.cpp' \
            | xargs pipx run clang-tidy==$(cat .clang-format-version) -p build --quiet

  # The same battery under address and undefined behaviour sanitizers, in debug so line numbers
  # survive. The release job proves the code fast; this one proves the speed rests on defined
  # behaviour rather than on undefined behaviour the optimiser happened to forgive.
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DEXCHANGE_SANITIZE=ON
      - run: cmake --build build-sanitize
      - run: ctest --test-dir build-sanitize --output-on-failure

  # The gateway's parsers face the internet, so every merge fuzzes them a little: the target
  # builds under Linux clang, which ships the libFuzzer runtime, and a bounded pass runs with the
  # sanitizers riding along. A crash here is a real finding, not a flake.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build-fuzz -DEXCHANGE_FUZZ=ON -DCMAKE_CXX_COMPILER=clang++
      - run: cmake --build build-fuzz --target gateway-fuzz
      - run: ./build-fuzz/components/gateway/gateway-fuzz -runs=20000 -max_len=512

  # The BOLT cycle proven end to end on every merge: instrument, run a small workload, optimize,
  # and run the optimized binary, all in instrumentation mode since a runner has no performance
  # counters; the box flips BOLT_MODE=perf for the real profile.
  bolt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y bolt-18
      - run: sudo ln -sf /usr/lib/llvm-18/lib/libbolt_rt_instr.a /usr/lib/libbolt_rt_instr.a
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --target sequencer-benchmark subgen
      - run: ./build/components/sequencer/subgen --submissions subs.exj --commands 30000 --seed 5
      - run: |
          LLVM_BOLT=llvm-bolt-18 scripts/bolt.sh build/components/sequencer/sequencer-benchmark \
            -- --submissions subs.exj --results bolt-check --policy none --warmup 1000
      - run: |
          ./build/components/sequencer/sequencer-benchmark.bolt \
            --submissions subs.exj --results bolt-check --policy none --warmup 1000 --label bolted

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The formatter is pinned in .clang-format-version and fetched exactly by pipx, so the
      # runner and a laptop cannot disagree about wrapping.
      - run: |
          files=$(find . -path ./build -prune -o \( -name '*.cpp' -o -name '*.hpp' \) -print)
          if [ -n "$files" ]; then
            printf '%s\n' "$files" | tr '\n' '\0' \
              | xargs -0 pipx run clang-format==$(cat .clang-format-version) --dry-run --Werror
          fi
